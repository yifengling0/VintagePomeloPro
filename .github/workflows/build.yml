# .github/workflows/build.yml
name: Build VintagePomeloPro HAP (arm64-v8a, unsigned)

on:
  push:
    branches: [master, main, main_proton_steamarm64]
    tags:
      - 'dev-*'                 # 开发版 (直接发布, 不占 Latest 徽章)
      - 'rc-*'                  # RC 版 (占 Latest 徽章)
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master, main, main_proton_steamarm64]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (dev-xx / rc-xx, 留空则只构建不发布)'
        required: false
        type: string

# GITHUB_TOKEN 权限:
#   contents: write — 拉源码 + 发布 Release (需要 write)
#   packages: read  — 拉 GHCR 私有 buildenv 镜像
permissions:
  contents: write
  packages: read

# Keep only the latest branch push; tagged/manual releases keep their own run.
concurrency:
  group: vpp-hap-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  membership-checks:
    name: Verify membership backend and checkout
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/value-added/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --prefix server/value-added --ignore-scripts --no-audit --no-fund
      - name: Test backend purchase verification and entitlements
        run: npm test --prefix server/value-added
      - name: Test client checkout and recovery
        run: |
          npm install --prefix "$RUNNER_TEMP/vpp-typescript" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund typescript@4.9.5
          ts="$RUNNER_TEMP/vpp-typescript/node_modules/typescript/lib/typescript.js"
          node scripts/run_value_added_service_tests.cjs --source "$ts"
          node scripts/run_membership_checkout_ui_tests.cjs "$ts"

  gnu-components:
    name: Verify GNU dependencies from a clean checkout
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          submodules: false
          fetch-depth: 1
      # GNU companion provenance includes the exact pinned Vulkan registry
      # and headers. The first job otherwise has no initialized submodules.
      - name: Restore pinned provenance and DXVK overlay test inputs
        run: |
          git -c url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf=git@github.com: \
            submodule update --init --depth=1 -- thirdparty/mesa thirdparty/dxvk

      - name: Test provenance and dependency restore
        run: |
          python3 scripts/ci_preflight.py --report ci-artifacts/ci-preflight.json
      - name: Restore verified GNU source archive cache
        id: gnu-source-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            build/linux-runtime-downloads/*.zip
            build/linux-runtime-downloads/*.tar.gz
          key: gnu-sources-v1-${{ runner.os }}-${{ hashFiles('docs/linux-steam/build-components.lock.json', 'docs/linux-steam/gnu-proton-modules.lock.json') }}
      - name: Fetch and verify published GNU dependency bytes
        run: python3 scripts/prepare_linux_runtime_components.py --report ci-artifacts/gnu-clean-checkout.json
      - name: Save verified GNU source archives
        if: steps.gnu-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            build/linux-runtime-downloads/*.zip
            build/linux-runtime-downloads/*.tar.gz
          key: gnu-sources-v1-${{ runner.os }}-${{ hashFiles('docs/linux-steam/build-components.lock.json', 'docs/linux-steam/gnu-proton-modules.lock.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: gnu-clean-checkout-${{ github.sha }}
          path: |
            ci-artifacts/gnu-clean-checkout.json
            ci-artifacts/ci-preflight.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: make NATIVE_ARCH=arm64-v8a hap-unsigned
    needs: [gnu-components, membership-checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}

    # 容器里默认 shell 是 sh, 不认 `set -o pipefail` 等 bash 语法
    # 这里强制所有 run step 用 bash
    defaults:
      run:
        shell: bash

    container:
      # Immutable image observed in the 2026-11-09 CI runs. Update this
      # digest deliberately and rerun clean-build/device qualification.
      image: ghcr.io/panedioic/winehua-buildenv@sha256:59f64bde2c1f6b54ad7505032622be94d52279b6c1523d54204992a2249b1a8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ---- 让私有 submodule 走 HTTPS + GITHUB_TOKEN ----
      # 前提: wine/box64/mesa-ohos 三个私有 submodule 与本仓库在同一账号/组织下
      # 若跨组织, 需替换成有跨仓库权限的 PAT (存到 secrets.SUBMODULE_PAT)
      - name: Configure git for private submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "git@github.com:"
          git config --global --add \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"
          # Savannah occasionally refuses GitHub-hosted runners. This mirror
          # contains the exact pinned libunistring commit from the gitlink.
          git config --global \
            url."https://github.com/GitMirroring/libunistring.git".insteadOf \
            "https://git.savannah.gnu.org/git/libunistring.git"
          # Old immutable tags still name the intermittently unavailable origin.
          # This public mirror contains the same pinned Nettle git objects.
          git config --global \
            url."https://github.com/gnutls/nettle.git".insteadOf \
            "https://git.lysator.liu.se/nettle/nettle.git"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Dispatch can build an existing immutable tag using the repaired workflow.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # Keep the pinned objects already fetched when an upstream Git service
      # briefly returns 502/503/504. Authentication/missing refs still fail fast;
      # the source gate below verifies every exact recursive gitlink afterwards.
      - name: Fetch pinned submodules with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          fetch_tail="$RUNNER_TEMP/vpp-submodule-fetch-tail.log"
          trap 'rm -f -- "$fetch_tail"' EXIT
          for attempt in 1 2 3 4 5; do
            set +e
            git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=45 submodule update \
              --init --recursive --depth=1 --jobs=4 2>&1 | tee /dev/stderr | tail -c 65536 > "$fetch_tail"
            fetch_status=${PIPESTATUS[0]}
            set -e
            if [ "$fetch_status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 5 ] ||
              grep -Eiq 'Authentication failed|returned error: (401|403)|repository.*not found|not our ref' "$fetch_tail" ||
              ! grep -Eiq 'returned error: 50[234]|HTTP[^0-9]*50[234]|Gitaly.*not available|TLS connection was non-properly terminated|Connection reset by peer|Could not resolve host|Failed to connect|Operation timed out|RPC failed; curl (18|28|35|56|92)' "$fetch_tail"; then
              exit "$fetch_status"
            fi
            echo "Transient submodule fetch failure; retry $((attempt + 1))/5 in 15s"
            sleep 15
          done

      # Check exact gitlinks, not .gitmodules branch tips. Fail before compilation.
      - name: Verify source and release versions
        id: source
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^(rc|dev)-[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || exit 1
            # checkout@v4 with ref=github.sha does not create refs/tags/*.
            # Fetch the annotated tag into FETCH_HEAD only; never overwrite a
            # local or remote tag. Recreate the lightweight local ref the
            # version gate expects (same as actions/checkout on a tag name).
            git fetch --depth=1 --no-tags origin "refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              expected_sha="$tag_sha"
            fi
            test "$tag_sha" = "$expected_sha"
            if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              git tag "$RELEASE_TAG" "$expected_sha"
            fi
          fi
          python3 scripts/verify_ci_release.py source --expected-sha "$expected_sha" \
            --release-tag "$RELEASE_TAG" --output ci-artifacts/ci-source.json
          echo "commit=$expected_sha" >> "$GITHUB_OUTPUT"

      # Catch source-overlay drift against the exact recursive submodule before
      # beginning the long Native and graphics build.
      - name: Verify VirGL overlays against pinned source
        run: python3 host_tests/virgl_patch_application_test.py --source thirdparty/virglrenderer

      - name: Upload source version manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-versions-${{ steps.source.outputs.commit }}
          path: ci-artifacts/ci-source.json
          if-no-files-found: error

      # ---- CI-only: 无签名的 build-profile.json5 ----
      # 从 example 派生会踩坑: example 里的 signingConfigs 指向占位符路径,
      # hvigor 的 SignHap 任务会校验这些文件存在, 直接失败.
      # 这里显式写一份 signingConfigs 为空的 profile, 让 hvigor 跳过 SignHap,
      # 直接输出 entry-default-unsigned.hap.
      - name: Provision unsigned build-profile.json5
        run: |
          cat > build-profile.json5 <<'JSON5'
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "targetSdkVersion": "6.1.0(23)",
                  "compatibleSdkVersion": "6.1.0(23)",
                  "runtimeOS": "HarmonyOS",
                  "buildOption": {
                    "nativeCompiler": "BiSheng",
                    "strictMode": {
                      "caseSensitiveCheck": true,
                      "useNormalizedOHMUrl": true
                    }
                  }
                }
              ],
              "buildModeSet": [
                {
                  "name": "debug"
                },
                {
                  "name": "release"
                }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  {
                    "name": "default",
                    "applyToProducts": ["default"]
                  }
                ]
              }
            ]
          }
          JSON5
          echo "[ci] wrote unsigned build-profile.json5 (signingConfigs empty)"

      # ---- 兜底: 确保预构建 buildenv 含当前源码所需工具 ----
      # libltdl-dev 是 Wine 依赖; glslangValidator 是 DXVK 配置阶段生成
      # 内置 SPIR-V 的硬依赖; x86_64-w64-mingw32-widl (mingw-w64-tools)
      # 是 VKD3D-Proton meson 的硬依赖. Dockerfile 已同步声明, 镜像更新后
      # 这里 no-op.
      - name: Ensure CI build dependencies present
        run: |
          bash scripts/ensure_build_dependencies.sh

      - name: Verify native build prerequisites before compilation
        run: |
          set -euo pipefail
          for tool in gcc g++ make cmake ninja meson bison flex autoconf automake \
                      libtoolize pkg-config git python3 java zip file \
                      glslangValidator spirv-as spirv-dis spirv-val spirv-opt \
                      msgfmt curl wget makeinfo xz aarch64-linux-gnu-gcc \
                      x86_64-w64-mingw32-g++ i686-w64-mingw32-g++ \
                      x86_64-w64-mingw32-widl; do
            command -v "$tool" >/dev/null || { echo "Missing CI tool: $tool" >&2; exit 1; }
          done
          test -f /usr/share/aclocal/ltdl.m4
          python3 -c 'import yaml, mako, markupsafe'
          # Compile and link a real probe, so a compiler without target libc
          # startup objects is rejected here rather than in box64's CMake.
          mkdir -p ci-artifacts
          printf 'int main(void) { return 0; }\n' | \
            aarch64-linux-gnu-gcc -x c - -o ci-artifacts/arm64-toolchain-probe
          file ci-artifacts/arm64-toolchain-probe
          rm ci-artifacts/arm64-toolchain-probe

      - name: Test versioned Wayland generated-header staging
        run: |
          python3 host_tests/wayland_header_staging_test.py
          python3 host_tests/llvm_mingw_download_test.py
          python3 host_tests/display_libs_download_test.py

      - name: Show environment
        run: |
          echo "== toolchain =="
          gcc --version | head -1
          cmake --version | head -1
          meson --version
          ninja --version
          python3 --version
          glslangValidator --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1
          i686-w64-mingw32-g++ --version | head -1
          java -version 2>&1 | head -1
          echo "== OHOS SDK =="
          ls /apps/harmony/sdk/default/openharmony/native/llvm/bin/clang
          /apps/harmony/bin/hvigorw --version || true
          echo "== nproc =="
          nproc

      # Hvigor automatically runs entry:clean after a fresh checkout or a
      # toolchain change, deleting the project root build/ directory. Trigger
      # that clean before restoring downloads or compiling native libraries.
      - name: Install ArkTS project dependencies
        run: |
          ohpm install --all
          # Dependency installation must not rewrite committed app inputs.
          git diff --exit-code HEAD --ignore-submodules=all

      - name: Prepare Hvigor before restoring native build inputs
        run: |
          set -euo pipefail
          if [ -d build ] && [ -n "$(ls -A build)" ]; then
            echo "Refusing Hvigor prebuild: native build directory is not empty" >&2
            exit 1
          fi
          hvigor=(/apps/harmony/bin/hvigorw --mode module -p module=entry@default -p product=default -p buildMode=release default@PreBuild)
          "${hvigor[@]}"
          # Exercise the real project a second time with a sentinel: a future
          # Hvigor behavior change must fail before any expensive native work.
          mkdir -p build
          sentinel=build/.ci-hvigor-clean-sentinel
          printf 'preserve native build outputs\n' > "$sentinel"
          "${hvigor[@]}"
          test -f "$sentinel" || { echo "Hvigor deleted the native build directory" >&2; exit 1; }
          rm -f "$sentinel"

      - name: Restore pinned GNU source archive cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            build/linux-runtime-downloads/*.zip
            build/linux-runtime-downloads/*.tar.gz
          key: gnu-sources-v1-${{ runner.os }}-${{ hashFiles('docs/linux-steam/build-components.lock.json', 'docs/linux-steam/gnu-proton-modules.lock.json') }}

      - name: Verify restored Linux Steam and GNU Proton components
        run: |
          set -euo pipefail
          python3 scripts/prepare_linux_runtime_components.py --report ci-artifacts/gnu-components.json

      # Replay first, before the hour-long native dependency build. This uses
      # small fixtures and leaves the verified checkout untouched.
      - name: Restore verified native source archives
        id: native-source-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            build/downloads/*.tar.gz
            build/downloads/*.tar.xz
            .temp/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          key: native-sources-v2-${{ runner.os }}-${{ hashFiles('scripts/build_display_libs.sh', 'scripts/build_xcb_stack.sh', 'scripts/build_x11_client.sh', 'scripts/build_xwayland.sh', 'scripts/download_verified_source.sh', 'scripts/prefetch_x11_sources.py', 'scripts/download_llvm_mingw.py') }}

      - name: Verify fresh and incremental FEX source overlays
        env:
          VP_KEEP_TOOLCHAIN_ARCHIVE: '1'
        run: |
          # Fail early on verified display source downloads rather than after Wine builds.
          bash scripts/build_display_libs.sh --fetch-only
          python3 host_tests/verified_source_download_test.py
          python3 scripts/prefetch_x11_sources.py --downloads build/downloads
          # wlroots host compilation needs generated protocol enum headers;
          # test with an empty host include directory before the long build.
          bash scripts/build_wayland.sh --scanner-only
          WAYLAND_SCANNER="$PWD/build/host-tools/bin/wayland-scanner" python3 host_tests/wlroots_protocol_headers_test.py
          WAYLAND_SCANNER="$PWD/build/host-tools/bin/wayland-scanner" python3 host_tests/native_protocol_build_test.py
          python3 host_tests/fex_overlay_replay_test.py --output ci-artifacts/fex-overlays.json
          python3 host_tests/fex_build_identity_test.py
          python3 host_tests/fex_simd_runtime_test.py
          # Compile both device probes; execution still requires Wine/FEX.
          i686-w64-mingw32-gcc -O2 tests/runtime/fex_smc_blocks.c -o ci-artifacts/fex-smc-i686.exe
          x86_64-w64-mingw32-gcc -O2 tests/runtime/fex_smc_blocks.c -o ci-artifacts/fex-smc-x86_64.exe

      - name: Save verified native source archives
        if: steps.native-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            build/downloads/*.tar.gz
            build/downloads/*.tar.xz
            .temp/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          key: native-sources-v2-${{ runner.os }}-${{ hashFiles('scripts/build_display_libs.sh', 'scripts/build_xcb_stack.sh', 'scripts/build_x11_client.sh', 'scripts/build_xwayland.sh', 'scripts/download_verified_source.sh', 'scripts/prefetch_x11_sources.py', 'scripts/download_llvm_mingw.py') }}

      - name: Test X11 window identities and Wine overlay verification
        run: |
          python3 host_tests/display_spawn_fds_test.py
          python3 host_tests/display_child_log_test.py
          python3 host_tests/x11_runtime_contract_test.py
          python3 host_tests/display_overlay_stack_test.py
          python3 host_tests/x11_external_host_test.py
          python3 host_tests/wine_overlay_proof_test.py

      - name: Test X11 input and Ability restore before the long source build
        run: |
          python3 host_tests/x11_desktop_input_test.py
          python3 host_tests/wine_ability_restore_test.py
          make test-renderer-scopes

      - name: Test Proton runtime lifecycle and Steam downloads
        run: make test-game-runtime

      - name: Configure every Native target before the long source build
        run: |
          python3 scripts/ci_preflight.py --skip-tests \
            --sdk /apps/harmony/sdk/default/openharmony --report ci-artifacts/native-preflight.json
          git diff --exit-code HEAD --ignore-submodules=all

      - name: Reuse pinned official Steam download archives
        uses: actions/cache@v4
        with:
          path: build/cache/steam-official
          key: steam-official-${{ hashFiles('entry/src/main/resources/rawfile/linux-steam/deployment.json', 'docs/linux-steam/native-sdk.lock.json') }}
          restore-keys: steam-official-

      - name: Build HAP
        env:
          NATIVE_ARCH: arm64-v8a
          WINE_ARCH: aarch64
          GUEST_ARCH: aarch64
          # 与上游一致: guest gfx 负责自动构建 host-tools/wayland-scanner
          # (build_native.sh 硬性依赖), 并产出完整 guest Mesa/VirGL 载荷;
          # wine-mono 必须与 appwiz.cpl 同包, 否则 assemble.sh 直接失败。
          BUILD_GUEST_GFX: '1'
          BUILD_GUEST_VULKAN: '1'
          BUILD_WINE_MONO: '1'
          # Rebuilt bytes are candidates, not the device-accepted binary lock.
          SOURCE_BUILD_MANIFEST: ${{ github.workspace }}/ci-artifacts/ci-source.json
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a WINE_ARCH=aarch64 GUEST_ARCH=aarch64 hap-unsigned
          make NATIVE_ARCH=arm64-v8a WINE_ARCH=aarch64 arm64ec-release-gate
          make test-xdg-resource-lifecycle

      # These tests extract production functions from the patched Wine tree.
      # Run after assemble, never against the pristine submodule checkout.
      - name: Test patched X11 presentation and window lifecycle
        run: make test-x11-integration test-venus-native-present

      - name: Locate artifacts
        id: art
        run: |
          set -eux
          out_dir=entry/build/default/outputs/default
          ls -lh "$out_dir"
          hap="$out_dir/entry-default-unsigned.hap"
          test -s "$hap"
          python3 scripts/verify_ci_release.py artifact --manifest ci-artifacts/ci-source.json \
            --hap "$hap" --output ci-artifacts/ci-artifact.json
          python3 scripts/prepare_linux_runtime_components.py --hap "$hap" --report ci-artifacts/gnu-components-hap.json
          python3 scripts/prepare_release_offline_packages.py --verify-only --output-dir build/release-offline --hap "$hap"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path('build/release-offline')
          report = json.loads((folder / 'release-offline-packages.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, item in zip(('steam_offline', 'proton_offline'), report['packages']):
                  output.write(f"{key}={folder / item['fileName']}\n")
          PY
          echo "hap=$hap" >> "$GITHUB_OUTPUT"

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: VintagePomeloPro-arm64-v8a-unsigned-${{ steps.source.outputs.commit }}
          path: |
            ${{ steps.art.outputs.hap }}
            ci-artifacts/ci-source.json
            ci-artifacts/ci-artifact.json
            ci-artifacts/gnu-components.json
            ci-artifacts/gnu-components-hap.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload matching offline import packages
        uses: actions/upload-artifact@v4
        with:
          name: VintagePomeloPro-offline-${{ steps.source.outputs.commit }}
          path: |
            ${{ steps.art.outputs.steam_offline }}
            ${{ steps.art.outputs.proton_offline }}
            build/release-offline/release-offline-packages.json
            build/release-offline/SHA256SUMS-current.txt
            build/release-offline/OFFLINE-IMPORT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/**/meson-logs/**
            build/**/CMakeFiles/CMakeOutput.log
            build/**/CMakeFiles/CMakeError.log
            build/**/config.log
            ci-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # Release job: 仅在推 tag 或手动指定 release_tag 时运行
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/dev-') || startsWith(github.ref, 'refs/tags/rc-') || github.event.inputs.release_tag != ''

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0        # 需要历史 commit 生成 changelog
          fetch-tags: true

      - name: Determine release tag & Latest ownership
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$tag" =~ ^(rc|dev)-[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || exit 1
          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            git fetch --depth=1 --no-tags origin "refs/tags/$tag"
            git update-ref "refs/tags/$tag" FETCH_HEAD
          fi
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Latest 徽章归属: rc-* 占, dev-* 不占
          # (GitHub 规则: prerelease 不能是 latest, 故两种 tag 均不标 pre,
          #  由 make_latest 参数控制 Latest 徽章)
          case "$tag" in
            dev-*) make_latest=false ;;
            *)     make_latest=true ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag (make_latest=$make_latest)"

      - name: Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: VintagePomeloPro-arm64-v8a-unsigned-${{ needs.build.outputs.source_sha }}
          path: ./release-assets

      - name: Rename artifact with version
        run: |
          set -eux
          cd release-assets
          # upload-artifact preserves the common ancestor when adding manifests.
          mapfile -t haps < <(find . -type f -name '*.hap')
          test "${#haps[@]}" -eq 1
          for f in "${haps[@]}"; do
            mv "$f" "VintagePomeloPro-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"
          done
          cp ci-artifacts/ci-source.json "VintagePomeloPro-${{ steps.tag.outputs.tag }}-source.json"
          cp ci-artifacts/ci-artifact.json "VintagePomeloPro-${{ steps.tag.outputs.tag }}-artifact.json"
          ls -lh

      - name: Download matching offline import packages
        uses: actions/download-artifact@v4
        with:
          name: VintagePomeloPro-offline-${{ needs.build.outputs.source_sha }}
          path: ./release-assets

      - name: Verify offline packages match the published HAP
        run: python3 scripts/prepare_release_offline_packages.py --verify-only --output-dir release-assets --hap "release-assets/VintagePomeloPro-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"

      # A successful source build is not hardware regression approval. RC
      # publication still requires the reviewed final-byte compatibility locks.
      - name: Verify reviewed runtime before RC publication
        if: startsWith(steps.tag.outputs.tag, 'rc-')
        run: python3 scripts/check_runtime_components.py --hap "release-assets/VintagePomeloPro-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"

      - name: Generate changelog
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          # 找到上一个 tag (若存在)
          prev_tag=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.tag }}^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            {
              echo "## Changes since \`$prev_tag\`"
              echo
              git log --pretty=format:'- %s (%h)' "$prev_tag..${{ steps.tag.outputs.tag }}"
            } > changelog.md
          else
            echo "## Initial release" > changelog.md
          fi
          {
            echo
            echo
            echo "---"
            echo
            echo "**Note**: This build is **unsigned**. Sign the HAP with a valid device/release profile before installation; developer mode alone does not sign it."
            echo
            echo "Built from commit \`${SOURCE_SHA:0:7}\`."
          } >> changelog.md
          if [ -f "docs/releases/${{ steps.tag.outputs.tag }}.md" ]; then
            cat "docs/releases/${{ steps.tag.outputs.tag }}.md" >> changelog.md
          fi
          echo "---- changelog.md ----"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VintagePomeloPro ${{ steps.tag.outputs.tag }}
          body_path: changelog.md
          files: |
            release-assets/*.hap
            release-assets/*.json
            release-assets/*.zip
            release-assets/SHA256SUMS-current.txt
            release-assets/OFFLINE-IMPORT.txt
          draft: false
          # dev-*/rc-* 均不标 pre-release (GitHub 规则: prerelease 不能是 latest)
          prerelease: false
          # Latest 徽章: rc-* 占, dev-* 不占
          make_latest: ${{ steps.tag.outputs.make_latest }}
          fail_on_unmatched_files: true
