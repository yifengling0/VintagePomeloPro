<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经典 / Deck · 交互设计</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color-scheme:dark;--muted:#8e9baf;--accent:#43a9ff}*{box-sizing:border-box}body{margin:0;background:#0c1019;color:#f3f6fc}button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:#263346}button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid #8dd2ff;outline-offset:3px}button.primary{background:#2695ef;color:white;font-weight:650}button.quiet{background:transparent;color:var(--muted)}button:disabled{opacity:.5;cursor:default}a{color:#87caff}.prototype{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 28px;background:#171f2d;border-bottom:1px solid #2a364a;font-size:13px}.prototype span{color:#a7b7ce}.prototype select{font:inherit;max-width:100%;padding:6px;border-radius:6px;background:#253043;color:white}.app{min-height:calc(100vh - 68px)}header{display:flex;align-items:center;gap:16px;padding:24px 40px}.brand{font-size:20px;font-weight:750;letter-spacing:.3px}.brand small{font-size:13px;font-weight:400;color:var(--muted);margin-left:12px}.spacer{flex:1}.dot{color:#75d9bc}.status{font-size:13px;color:var(--muted)}.classic{color:#243047;background:#f3f6fc;min-height:calc(100vh - 68px);--muted:#6b7d94}.classic header{border-bottom:1px solid #dfe7f3}.classic button{background:#e1eafa;color:#314b71}.classic button.primary{background:#3479e7;color:white}.classicmain{display:grid;grid-template-columns:190px 1fr;gap:36px;padding:30px 40px}aside button{display:block;width:100%;text-align:left;margin-bottom:10px;background:transparent!important}aside button.active{background:#dfeaff!important;color:#2562bd}.classic h1{font-size:28px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.7}.classiccards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}.classiccard{padding:25px;background:white;border:1px solid #e0e8f4;border-radius:18px;min-height:180px}.tileicon{display:grid;place-items:center;font-size:27px;width:60px;height:60px;border-radius:14px;background:#e6efff;color:#337bc6;margin-bottom:20px}.deck{background:radial-gradient(ellipse at 68% 10%,#192d49 0,transparent 56%),#0d1421;min-height:calc(100vh - 68px)}.decknav{display:flex;gap:8px;padding:0 40px 12px}.decknav button.active{background:#f2f7ff;color:#17283c}.decknav button{background:transparent;color:#99abc2}.deckmain{padding:12px 40px 32px}.hero{border:1px solid #34526d;overflow:hidden;border-radius:22px;min-height:300px;padding:42px;display:flex;align-items:center;background:linear-gradient(110deg,#133454,#1a4260 54%,#397a7e);position:relative}.hero:after{content:"HMOS / DECK";position:absolute;right:28px;bottom:22px;font-size:clamp(26px,5vw,78px);font-weight:900;letter-spacing:-3px;color:#c5f7ff19;pointer-events:none}.hero>div{max-width:590px;z-index:1}.eyebrow{font-size:12px;letter-spacing:2px;color:#80d5ff}.hero h1{font-size:clamp(30px,3.3vw,48px);line-height:1.15;margin:15px 0}.hero p{font-size:15px;line-height:1.8;color:#c0d3e5;margin:0 0 22px;max-width:510px}.actions{display:flex;gap:12px;flex-wrap:wrap}.sectionhead{display:flex;align-items:center;margin:25px 0 16px}.sectionhead h2{font-size:19px;margin:0}.sectionhead span{font-size:13px;color:var(--muted);margin-left:14px}.covers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}.cover{min-height:185px;border:1px solid #2d3f56;border-radius:14px;background:linear-gradient(150deg,#28576f,#14283a);padding:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}.cover:hover,.cover:focus-visible{transform:translateY(-5px)}.cover:nth-child(2){background:linear-gradient(150deg,#574e6f,#2d2942)}.cover:nth-child(3){background:linear-gradient(150deg,#5b6243,#293329)}.cover:nth-child(4){background:linear-gradient(150deg,#754b45,#372b38)}.cover:nth-child(5){background:linear-gradient(150deg,#3b617d,#222c46)}.cover .art{font-size:28px;font-weight:800;color:#ffffff83}.cover strong{font-size:15px}.cover small{display:block;font-size:11px;color:#d0d9e7;margin-top:6px}.empty{padding:24px;border:1px dashed #344863;border-radius:14px;color:#a3b5ca;line-height:1.8}.hint{display:flex;gap:22px;padding:18px 40px;border-top:1px solid #26374d;color:#93a5bf;font-size:13px}.key{border:1px solid #546c85;border-radius:5px;padding:2px 6px;color:#d1e5fb;margin-right:6px}dialog{color:#edf5ff;background:#152235;border:1px solid #3b5878;border-radius:22px;padding:30px;max-width:540px;width:calc(100% - 36px);box-shadow:0 30px 100px #0008}dialog::backdrop{background:#040b15b8;backdrop-filter:blur(5px)}dialog h2{margin:0 0 12px;font-size:23px}dialog p{font-size:14px;color:#b2c4da;line-height:1.8}dialog .facts{font-size:13px;color:#91b8dc;border:1px solid #314a67;border-radius:10px;padding:13px;margin:18px 0}dialog .actions{margin-top:24px}progress{width:100%;height:10px;accent-color:#2a9fff}.client{margin:15px 40px 28px;border:1px solid #3e536d;border-radius:14px;min-height:440px;background:#161e29}.clienthead{padding:15px 22px;background:#202b3a;display:flex;gap:10px;align-items:center}.clientbody{padding:60px 25px;text-align:center}.clientbody h1{font-size:32px}.clientbody p{color:#a3b7cd;line-height:1.8}.bigclient{background:radial-gradient(at 50% 30%,#213c5e,#0c1526)}.notice{padding:14px 40px;color:#b8cee4;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f2f7ff;color:#132337;border-radius:10px;padding:12px 20px;box-shadow:0 4px 30px #0006;z-index:5;max-width:90%;font-size:14px}[hidden]{display:none!important}@media(max-width:800px){header{padding:18px 20px;gap:10px;flex-wrap:wrap}.brand small{display:none}.status{display:none}.deckmain{padding:10px 20px 24px}.decknav{padding:0 20px 10px;overflow:auto}.hero{padding:28px;min-height:280px}.covers{grid-template-columns:repeat(3,minmax(0,1fr))}.cover{min-height:155px;padding:15px}.classicmain{grid-template-columns:1fr;padding:22px;gap:15px}aside{display:flex;overflow:auto}aside button{white-space:nowrap}.classiccards{grid-template-columns:repeat(2,minmax(0,1fr))}.client{margin:10px 20px}.hint{padding:16px 20px;gap:12px;flex-wrap:wrap}.prototype{padding:10px 20px}.notice{padding:12px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="prototype"><strong>交互原型</strong><span>安装、登录和游戏启动均为模拟；不连接真实账号或下载资源。</span><label>演示状态 <select id="scenario"><option value="missing">未安装 Steam</option><option value="installed">已安装，未登录</option><option value="ready">已安装并登录</option><option value="update">有可用更新</option></select></label></div>
<div id="root"></div><dialog id="modal"></dialog><div class="toast" id="toast" hidden role="status"></div>
<script>
const root=document.querySelector('#root'),modal=document.querySelector('#modal');
let mode='classic',installed=false,logged=false,update=false,view='home',clientBig=false,returnView='home',updatePrepared=false,installPaused=false,timer=null,step=0,running=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const n=document.querySelector('#toast');n.textContent=t;n.hidden=false;clearTimeout(n.hide);n.hide=setTimeout(()=>n.hidden=true,3000)}
function act(label,action,cls=''){return `<button class="${cls}" data-action="${action}">${esc(label)}</button>`}
function switchMode(){mode=mode==='classic'?'deck':'classic';view='home';render()}
function header(){return `<header><div class="brand">${mode==='classic'?'旧柚 Pro':'HMOSDECK'}<small>${mode==='classic'?'经典界面':'你的游戏，随时继续'}</small></div><div class="spacer"></div><span class="status">${installed?(logged?'<span class="dot">●</span> Steam 已连接':'Steam 待登录'):'Steam 未安装'}</span>${act(updatePrepared?'Steam · 更新待应用':update?'Steam · 可更新':'Steam','steam')}${act(mode==='classic'?'Deck 模式':'返回经典','switch','primary')}</header>`}
function classic(){return `<div class="app classic">${header()}<div class="classicmain"><aside>${['最近','全部程序','收藏','运行中','系统设置'].map((x,i)=>`<button class="${i===1?'active':''}" data-action="${i===4?'settings':'local'}">${x}</button>`).join('')}</aside><main><h1>我的程序</h1><div class="sub">保留熟悉的程序列表、文件管理和设置。右上角可随时进入 Deck。</div><div class="classiccards"><div class="classiccard"><div class="tileicon">▣</div><strong>Wine 桌面</strong><p class="sub">Windows 程序与原有配置</p>${act('打开','local')}</div><div class="classiccard"><div class="tileicon">▤</div><strong>文件管理</strong><p class="sub">管理本地游戏与文件</p>${act('打开','local')}</div><div class="classiccard"><div class="tileicon">S</div><strong>Steam</strong><p class="sub">${installed?'已安装 Linux ARM64 客户端':'安装后管理库、下载与云存档'}</p>${act(installed?'打开 Steam':'安装 Steam','steam','primary')}</div></div></main></div></div>`}
function deck(){let title=!installed?'准备好进入游戏世界':!logged?'连接你的 Steam':'继续上次的旅程';let text=!installed?'一键下载安装 Steam。已添加的本地游戏仍可使用，经典界面也随时可返回。':!logged?'在 Steam 中完成登录，游戏库、下载和云存档由同一客户端管理。':'从最近游戏继续，或打开 Steam 查看完整游戏库。所有启动都沿用当前会话。';return `<div class="app deck">${header()}<nav class="decknav">${act('首页','home','active')}${act('已安装','library')}${act('运行中'+(running?' · 1':''),'running')}${act('下载','downloads')}${act('设置','settings')}</nav><main class="deckmain"><section class="hero"><div><div class="eyebrow">PLAY YOUR WAY</div><h1>${title}</h1><p>${text}</p><div class="actions">${act(!installed?'安装 Steam':!logged?'登录 Steam':running?'恢复游戏':'启动示例游戏','primary','primary')}${act('Steam 大屏','big')}</div></div></section><div class="sectionhead"><h2>${logged?'最近游戏':'本地游戏'}</h2><span>${logged?'示例数据，仅演示布局':'Steam 登录后会显示真实已安装游戏'}</span><div class="spacer"></div>${act('查看游戏库','library','quiet')}</div>${logged?`<div class="covers">${['旅程','像素与远方','静谧山谷','深海回声','本地冒险'].map((x,i)=>`<button class="cover" data-action="${i===4?'local':'game'}"><span class="art">0${i+1} /</span><span><strong>${x}</strong><small>${i===4?'非 Steam · 本地':'Steam · 已安装 · 示例'}</small></span></button>`).join('')}</div>`:`<div class="empty">${act('本地 Windows 程序','local')}<p>尚未添加更多本地游戏。Steam 资源准备好后，无需再次导入游戏库。</p></div>`}</main><footer class="hint"><span><b class="key">A / Enter</b>确认</span><span><b class="key">B / Esc</b>返回</span><span><b class="key">☰</b>设置</span><span class="spacer"></span><span>经典与 Deck 共用设置和游戏配置</span></footer></div>`}
function client(){return `<div class="app ${mode==='classic'?'classic':'deck'}">${header()}<div class="notice">原型中的 Steam 占位画面；正式实现打开同一官方 Linux Steam 会话。</div><section class="client ${clientBig?'bigclient':''}"><div class="clienthead"><strong>Steam ${clientBig?'大屏模式':'桌面模式'}</strong><span class="spacer"></span>${act('返回'+(mode==='deck'?' Deck':'经典'),'back')}${act(clientBig?'退出大屏':'进入大屏','client-mode')}</div><div class="clientbody"><h1>${!logged?'Steam 登录':returnView==='downloads'?'下载':returnView==='library'?'游戏库':clientBig?'你的游戏，准备就绪':'Steam'}</h1><p>${!logged?'请在真实 Steam 窗口完成登录。应用不另设账号密码输入。':running?'游戏已在运行，返回主界面不会结束它。':'在真实客户端中完成浏览、安装、更新和云同步。'}</p>${!logged?act('模拟登录完成','login','primary'):act('模拟启动示例游戏','game','primary')}</div></section></div>`}
function render(){document.querySelector('#scenario').value=update?'update':installed?(logged?'ready':'installed'):'missing';root.innerHTML=view==='client'?client():mode==='classic'?classic():deck()}
function openModal(html){modal.innerHTML=html;modal.showModal()}
function installDialog(isUpdate=false){if(installPaused){openModal(`<h2>继续下载</h2><p>上次下载进度已保留，可以从断点继续。</p><div class="actions">${act('继续下载','continue-install','primary')}${act('稍后','close')}</div>`);return}openModal(`<h2>${isUpdate?'更新 Steam':'安装 Steam'}</h2><p>${isUpdate?'更新先下载到独立目录，当前 Steam／游戏退出后应用。':'将准备运行组件与官方 Steam 客户端。安装完成后即可在 Steam 中登录。'}</p><div class="facts">位置：Z:\\SteamLinuxARM64<br>下载大小与所需空间：以实际发布清单为准<br>现有游戏、存档和账号数据保留</div><div class="actions">${act(isUpdate?'下载更新':'安装 Steam',isUpdate?'start-update':'start-install','primary')}${act('暂不安装','close')}</div>`)}
function installStart(isUpdate=false){step=0;installPaused=false;function tick(){if(installPaused)return;step++;const phases=['准备下载','下载运行组件','下载官方客户端','校验文件','安装与检查','完成'];modal.innerHTML=`<h2>${isUpdate?'正在准备更新':'正在安装 Steam'}</h2><p>${phases[Math.min(step,5)]}</p><progress max="5" value="${step}"></progress><div class="actions">${act('暂停','pause')}${act('模拟网络中断','fail','quiet')}</div>`;if(step>=5){clearInterval(timer);installed=true;update=false;updatePrepared=isUpdate;modal.close();render();if(isUpdate){toast('更新已下载，当前会话继续使用原版本；退出后再应用')}else toast('安装完成，可以打开 Steam 登录')}}timer=setInterval(tick,500);tick()}
function openSteam(dest='home',big=false){returnView=dest;clientBig=big;if(!installed){installDialog();return}if(updatePrepared){openModal(`<h2>更新已下载</h2><p>当前 Steam／游戏继续使用原版本。全部正常退出后，下次启动应用更新。</p><div class="actions">${act('继续打开当前版本','continue-steam','primary')}${act('关闭','close')}</div>`);return}if(update){openModal(`<h2>Steam 有可用更新</h2><p>可以先下载更新，也可以继续当前版本。</p><div class="actions">${act('下载更新','update','primary')}${act('继续打开 Steam','continue-steam')}</div>`);return}view='client';render()}
function handle(a){switch(a){case 'switch':switchMode();break;case 'home':view='home';render();break;case 'steam':openSteam();break;case 'library':openSteam('library');break;case 'downloads':openSteam('downloads');break;case 'big':openSteam('home',true);break;case 'back':view='home';render();break;case 'client-mode':clientBig=!clientBig;render();break;case 'primary':if(!installed)installDialog();else if(!logged)openSteam();else if(running)toast('恢复同一游戏窗口');else handle('game');break;case 'login':logged=true;view='home';render();toast('Steam 已登录（演示）');break;case 'game':if(!installed||!logged){openSteam('library');break}running=true;toast('正在通过 Steam 启动示例游戏（演示）');render();break;case 'local':toast('复用现有 Windows 程序与本地文件功能');break;case 'running':openModal(`<h2>正在运行</h2><p>${running?'示例游戏正在运行。切换经典／Deck 不结束游戏。':'当前没有运行中的游戏。'}</p><div class="actions">${running?act('恢复游戏','resume-game','primary'):''}${act('显示 Steam','show-steam')}${act('关闭','close')}</div>`);break;case 'resume-game':modal.close();toast('恢复同一游戏窗口');break;case 'show-steam':modal.close();openSteam();break;case 'settings':openModal(`<h2>设置</h2><p>当前界面：${mode==='deck'?'Deck':'经典'}。应用设置、会员与兼容配置共用。</p><div class="actions">${act(mode==='deck'?'返回经典':'切换 Deck','settings-switch','primary')}${act(installed?'检查 Steam 更新':'安装 Steam',installed?'check-update':'install')}${act('关闭','close')}</div>`);break;case 'settings-switch':modal.close();switchMode();break;case 'install':modal.close();installDialog();break;case 'check-update':modal.close();update=true;installDialog(true);break;case 'update':modal.close();installDialog(true);break;case 'continue-steam':modal.close();view='client';render();break;case 'start-install':installStart();break;case 'start-update':installStart(true);break;case 'pause':installPaused=true;modal.innerHTML=`<h2>下载已暂停</h2><p>已完成内容保留，继续后从断点恢复。返回主页也能稍后继续。</p><div class="actions">${act('继续下载','continue-install','primary')}${act('返回主页','close')}</div>`;break;case 'fail':installPaused=true;modal.innerHTML=`<h2>网络中断</h2><p>无法连接下载源，已完成内容保留。</p><div class="actions">${act('重试','continue-install','primary')}${act('返回主页','close')}</div>`;break;case 'continue-install':if(timer){installPaused=false}else installStart();break;case 'close':modal.close();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action)});
document.querySelector('#scenario').addEventListener('change',e=>{clearInterval(timer);timer=null;modal.close();const s=e.target.value;installed=s!=='missing';logged=s==='ready'||s==='update';update=s==='update';running=false;updatePrepared=false;installPaused=false;view='home';render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view==='client'&&!modal.open){view='home';render()}});render();
</script></body></html>
