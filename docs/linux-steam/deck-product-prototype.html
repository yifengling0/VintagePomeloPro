<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HmosDeck · Linux Steam 会话体验原型</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;--bg:#0a0b0d;--rail:#121417;--surface:#1a1d22;--line:#262a31;--fg:#f2f4f7;--muted:#9aa3af;--blue:#1a9fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select{font:inherit}button{border:0;background:var(--surface);color:inherit;padding:12px 18px;border-radius:8px;cursor:pointer;min-height:44px}button:hover{background:#30353f}button:active{transform:scale(.98)}button:focus-visible,select:focus-visible{outline:3px solid #9fd6ff;outline-offset:3px}button.primary{background:var(--blue);color:#07121c;font-weight:650}button.danger{background:#9d333f;color:#fff}button.ghost{background:transparent;color:var(--muted)}button:disabled{opacity:.5;cursor:wait}select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit;max-width:100%}h1,h2,h3,p{margin-top:0}p{line-height:1.7;color:var(--muted)}[hidden]{display:none!important}small,.muted{color:var(--muted)}.previewbar{padding:12px 22px;background:#15181d;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.previewbar strong{font-size:14px}.previewbar label{display:flex;align-items:center;gap:8px}.previewbar .disclaimer{flex:1;min-width:220px;color:#afb8c5}.spacer{flex:1}.shell{display:grid;grid-template-columns:174px minmax(0,1fr);min-height:650px}.rail{background:var(--rail);padding:28px 14px;display:flex;flex-direction:column;gap:8px}.wordmark{font-weight:750;letter-spacing:2px;font-size:17px;padding:0 12px 32px}.wordmark em{font-style:normal;color:var(--blue)}.rail button{text-align:left;background:transparent}.rail button.active{background:#242a33;color:#7cc6ff}.rail .bottom{margin-top:auto;padding-top:24px}.rail small{display:block;padding:0 12px 8px;font-size:12px}.content{min-width:0;padding:32px clamp(20px,4vw,50px)}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}.top h1{font-size:24px;margin:0}.status{color:var(--muted);font-size:13px}.hero{min-height:280px;position:relative;overflow:hidden;display:flex;align-items:center;padding:32px 0}.hero:after{content:"HMOS / DECK";position:absolute;right:-12px;bottom:6px;font-weight:850;font-size:clamp(42px,8vw,96px);letter-spacing:-4px;color:#ffffff07;pointer-events:none}.hero .copy{position:relative;z-index:1;max-width:560px}.eyebrow{font-size:12px;letter-spacing:2px;color:#72c4ff;margin-bottom:12px}.hero h2{font-size:clamp(28px,4vw,44px);line-height:1.18;margin:0 0 16px}.hero p{max-width:460px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sectiontitle{display:flex;align-items:center;gap:16px;margin:26px 0 18px}.sectiontitle h2{font-size:19px;margin:0}.covers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.cover{display:flex;flex-direction:column;text-align:left;background:none;padding:0;min-width:0;border-radius:9px;transition:transform .18s}.cover:hover,.cover:focus-visible{transform:translateY(-5px);background:transparent}.art{width:100%;aspect-ratio:2/3;display:flex;align-items:flex-end;padding:18px;border-radius:9px;background:linear-gradient(155deg,#2d4c47,#132223);font-size:clamp(17px,2.4vw,26px);font-weight:650;line-height:1.25;position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:150%;height:70%;border-radius:50%;background:#ffffff08;left:-50%;top:-20%;transform:rotate(-40deg)}.art[data-art="1"]{background:linear-gradient(145deg,#324562,#172333)}.art[data-art="2"]{background:linear-gradient(155deg,#6a464e,#30222e)}.art[data-art="3"]{background:linear-gradient(160deg,#535564,#242730)}.cover strong{font-size:14px;margin:10px 0 6px}.cover small{font-size:12px}.hint{padding:24px 0 0;color:var(--muted);font-size:12px}.kbd{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 4px;border:1px solid #57616d;border-radius:5px;color:#e0e6ef;margin-right:5px}.classic{background:#eff2f7;color:#253247;--muted:#66758a;--surface:#dfe6f2;--line:#d5deeb}.classic .rail{background:#e4eaf3}.classic .rail button.active{background:#d4e1f7;color:#2865b7}.classic .top{border-bottom:1px solid #d5deeb;padding-bottom:22px}.classic .wordmark em{color:#2865b7}.classic .hero{min-height:180px}.classic .hero:after{display:none}.classic .art{color:#f2f4f7}.classic .status{color:#63738b}.classic button.ghost{color:#52657e}.classic button:hover{filter:brightness(.96)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button.active{background:#eef5ff;color:#172334}.runtime{min-height:650px;position:relative;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#1f3047,#0c1119 70%)}.steamnav{display:flex;align-items:center;gap:12px;padding:25px 30px;flex-wrap:wrap;border-bottom:1px solid #ffffff12}.steamnav button{background:transparent;color:#c8d2e1}.steamnav button.active{background:#e4edfa;color:#172436}.steambrand{font-weight:700;letter-spacing:2px;margin-right:16px}.steamcontent{padding:36px clamp(20px,4vw,48px);flex:1;min-width:0}.steamcontent h1{font-size:28px}.runtime .covers{max-width:900px}.runtimefoot{padding:16px 30px;color:#a5b1c1;font-size:12px;display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid #ffffff12}.desktopstage{padding:25px;background:#111418;min-height:650px}.steamwindow{margin:0 auto;max-width:1050px;border:1px solid #3d4653;border-radius:9px;overflow:hidden;box-shadow:0 18px 65px #0006}.steamtitles{display:flex;align-items:center;padding:8px 14px;background:#222b37;font-size:13px}.steamtitles button{padding:2px 12px;min-height:32px}.desktopstage .runtime{min-height:550px}.launch{display:flex;min-height:650px;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#16314b,#0b1018 65%)}.launchlogo{font-size:22px;letter-spacing:6px;font-weight:750;margin-bottom:45px}.launch h1{font-size:28px;margin-bottom:14px}.launch p{max-width:500px}.launchstatus{min-height:30px;margin:12px 0 20px;color:#d7e2f1}.loading{height:3px;width:220px;background:#ffffff16;overflow:hidden;border-radius:2px;margin:10px 0 24px}.loading:after{content:"";display:block;width:40%;height:100%;background:var(--blue);animation:loading 1.5s ease-in-out infinite}@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}.game{position:relative;min-height:650px;display:flex;align-items:center;justify-content:center;padding:30px;background:#000}.gameframe{width:100%;max-width:950px;aspect-ratio:4/3;max-height:580px;display:grid;place-items:center;text-align:center;padding:25px;background:radial-gradient(ellipse at 50% 80%,#315149,#122923 60%,#0e1b1e);position:relative}.gameframe h1{font-size:clamp(24px,4vw,44px)}.gameframe p{color:#bbd6ce}.game .menubutton{position:absolute;top:15px;right:15px;background:#1a1d22db;z-index:2}.gameframe .demo{position:absolute;bottom:14px;left:14px;font-size:12px;color:#adc0b9}.windowgame .gameframe{max-width:650px;box-shadow:0 0 0 1px #4a6260;border-top:32px solid #283b3c}.note{font-size:13px;color:var(--muted);margin:18px 0 0}.downloadrow{padding:22px;background:#1a2635;border-radius:8px;margin:14px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.downloadrow>div{flex:1}.downloadrow strong{display:block;margin-bottom:8px}dialog{color:var(--fg);background:#181d25;border:1px solid #3b4552;border-radius:14px;padding:28px;width:min(520px,calc(100% - 32px));max-height:88vh;overflow:auto;box-shadow:0 30px 100px #0008}dialog::backdrop{background:#05080dba;backdrop-filter:blur(6px)}dialog h2{font-size:23px;margin:0 0 14px}dialog h3{font-size:16px;margin:20px 0 10px}dialog p{font-size:14px}dialog .actions{margin-top:20px}dialog .menulist{display:grid;gap:7px}dialog .menulist button{text-align:left;background:#232a35}.preference{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.preference>span{flex:1;min-width:180px}.preference small{display:block;margin-top:6px;line-height:1.6}.details{background:#11161e;padding:15px;border-radius:8px;font-size:13px;line-height:1.7;color:#afbed1;overflow-wrap:anywhere}progress{width:100%;height:10px;accent-color:var(--blue)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90%;padding:14px 20px;border-radius:8px;background:#e5edf7;color:#142236;z-index:5;font-size:14px;box-shadow:0 8px 40px #0006}.components{display:grid;gap:12px}.component{padding:18px;background:var(--surface);border-radius:8px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.component>div{flex:1;min-width:150px}.component small{display:block;margin-top:7px}.mainstatus{padding:14px 18px;border-radius:8px;background:#193044;color:#bfe4ff;margin-bottom:16px}.menufoot{font-size:12px;margin-bottom:0}.runtime .steamcontent p{max-width:680px}.mini-label{font-size:12px;padding:4px 8px;background:#262e39;border-radius:4px;color:#b2c4d8}.loginbox{max-width:440px;width:100%;background:#182330;border-radius:10px;padding:30px}.loginbox input{display:block;width:100%;padding:12px;background:#0e1721;border:1px solid #425267;color:inherit;border-radius:5px;margin:10px 0}.loginbox label{display:block;text-align:left;color:#b0c0d2;font-size:13px}.loginbox .actions{justify-content:center}
@media(max-width:760px){.shell{grid-template-columns:76px minmax(0,1fr)}.rail{padding:22px 8px}.rail button{padding:12px 6px;text-align:center;font-size:12px}.wordmark{font-size:12px;padding:0 4px 24px;letter-spacing:0}.wordmark span{display:none}.rail small{display:none}.content{padding:22px 20px}.top{margin-bottom:14px;gap:9px}.top h1{font-size:21px}.status{font-size:12px}.hero{padding:20px 0;min-height:250px}.hero h2{font-size:30px}.covers{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.art{font-size:21px}.steamnav{padding:18px 16px;gap:6px}.steamnav button{padding:10px 12px}.steambrand{margin-right:0}.steamcontent{padding:24px 20px}.desktopstage{padding:10px}.runtimefoot{padding:16px;gap:12px}.shell,.launch,.runtime,.game{min-height:620px}.game{padding:12px}.previewbar{padding:12px}.hero:after{font-size:42px;letter-spacing:-2px}.rail .bottom{padding-top:20px}.gameframe{max-height:none}.previewbar .disclaimer{min-width:180px}.steamcontent h1{font-size:25px}.game .menubutton{top:8px;right:8px}}@media(max-width:400px){.shell{grid-template-columns:64px minmax(0,1fr)}.content{padding:20px 14px}.hero h2{font-size:26px}.covers{gap:10px}.art{font-size:17px;padding:12px}.cover strong{font-size:13px}.hero .actions button{width:100%}.steambrand{width:100%}.preference select{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="previewbar">
<strong>会话体验原型</strong><span class="disclaimer">界面、进度、购买和游戏均为模拟，不连接账号或付款。</span>
<label>初始状态<select id="scenario"><option value="ready">已安装并登录</option><option value="installed">已安装，待登录</option><option value="missing">未安装</option><option value="update">组件可更新</option></select></label>
<label>设备<select id="device"><option value="tablet">平板 / PC</option><option value="phone">手机</option></select></label>
<button type="button" class="ghost" data-action="simulate-slow">模拟启动无进展</button>
</div>
<div id="root"></div>
<dialog id="modal" aria-label="系统菜单"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const root=document.querySelector('#root'),modal=document.querySelector('#modal');
const storage={get(k,f){try{return localStorage.getItem('hmosdeck-demo-'+k)||f}catch{return f}},set(k,v){try{localStorage.setItem('hmosdeck-demo-'+k,v)}catch{}}};
const games=[{name:'新仙剑奇侠传',tag:'Steam · GNU Proton',art:0},{name:'仙剑奇侠传四',tag:'Steam · GNU Proton',art:1},{name:'本地游戏',tag:'非 Steam · OHOS Wine',art:2},{name:'图形测试',tag:'内建工具 · 窗口展示',art:3}];
const s={theme:storage.get('theme','classic'),steamMode:storage.get('steam-mode','bigPicture'),gameMode:storage.get('game-mode','fitFullscreen'),installed:true,logged:true,update:false,steam:false,view:'home',page:'library',game:null,running:false,tab:'steam',cloud:'unknown',foreground:'home',device:'tablet',generation:0,phase:'',intent:'',pendingGame:null};
let phaseTimer=0,installTimer=0,toastTimer=0,installProgress=0,installUpdating=false,installPaused=false,dialogReturn=null;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='')=>`<button type="button" class="${cls}" data-action="${action}">${esc(label)}</button>`;
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)}
function saveMode(mode){s.steamMode=mode;storage.set('steam-mode',mode)}
function closeDialog(){if(modal.open)modal.close();dialogReturn?.focus();dialogReturn=null}
function dialog(html){if(!modal.open)dialogReturn=document.activeElement;modal.innerHTML=html;if(!modal.open)modal.showModal();modal.querySelector('button,select,input')?.focus()}
function status(){return s.running?'游戏运行中 · 可以继续':s.steam?'Steam 会话已打开':s.installed?'Steam 组件已就绪':'尚未安装 Steam'}
function covers(items=games.slice(0,2)){return `<div class="covers">${items.map(g=>`<button type="button" class="cover" data-action="game-${games.indexOf(g)}"><span class="art" data-art="${g.art}">${esc(g.name)}</span><strong>${esc(g.name)}</strong><small>${esc(g.tag)}</small></button>`).join('')}</div>`}
function shell(){return `<div class="shell ${s.theme==='classic'?'classic':''}"><nav class="rail" aria-label="应用导航"><div class="wordmark"><em>H</em><span>MOS</span>DECK</div>${button('首页','home',s.page==='home'?'active':'')}${button('游戏库','library',s.page==='library'?'active':'')}${button('Steam','steam')}${button('设置','settings')}<div class="bottom">${s.device!=='phone'?button('会员与赞助','membership','ghost'):''}${button(s.theme==='classic'?'切换 Deck':'返回经典','theme','ghost')}<small>主题选择会保存</small></div></nav><main class="content"><div class="top"><h1>${s.theme==='classic'?'旧柚 Pro':'你的游戏，随时继续'}</h1><div class="spacer"></div><span class="status" role="status">${status()}</span></div>${s.page==='components'?components():s.page==='library'?library():home()}<div class="hint"><span class="kbd">A</span>确认　<span class="kbd">B</span>返回　<span class="kbd">☰</span>运行页系统菜单</div></main></div>`}
function home(){let title=s.running?'继续你的旅程':!s.installed?'准备好进入游戏世界':s.logged?'从这里，进入游戏':'在 Steam 完成登录';let desc=s.running?'返回首页保留当前会话。恢复游戏后沿用原有输入和兼容配置。':!s.installed?'在线安装或离线导入。安装完成后留在组件页，由你选择何时启动。':'打开官方 Linux Steam，默认进入大屏。经典与 Deck 的主题选择单独保存。';return `<section class="hero"><div class="copy"><div class="eyebrow">PLAY YOUR WAY</div><h2>${title}</h2><p>${desc}</p><div class="actions">${button(s.running?'继续游戏':s.installed?'打开 Steam':'安装 Steam',s.running?'resume':s.installed?'steam':'install','primary')}${button('我的游戏库','library')}</div></div></section><div class="sectiontitle"><h2>最近游玩</h2><div class="spacer"></div>${button('查看全部','library','ghost')}</div>${covers(games)}<p class="note">封面为示意占位。Steam 游戏仍经官方客户端认证、同步和兼容工具启动。</p>`}
function library(){const items=s.tab==='steam'?games.slice(0,2):s.tab==='local'?[games[2]]:[games[3]];return `<div class="sectiontitle"><h2>游戏库</h2><div class="spacer"></div>${button(s.running?'继续游戏':'打开完整 Steam 库',s.running?'resume':'steam','primary')}</div><div class="tabs">${button('Steam 游戏','tab-steam',s.tab==='steam'?'active':'')}${button('本地游戏','tab-local',s.tab==='local'?'active':'')}${button('内建工具','tab-tools',s.tab==='tools'?'active':'')}</div>${covers(items)}<p class="note">游戏默认保持比例铺满运行页。设置工具、登录与报错弹窗保持可操作尺寸。</p>`}
function components(){return `<div class="sectiontitle"><h2>Steam 组件</h2></div><p>管理安装与更新，保留用户游戏库、账号和存档。完成后由你主动打开 Steam。</p><div class="components"><div class="component"><div><strong>Linux Steam</strong><small>${s.installed?'已安装 · '+(s.update?'可更新':'已就绪'):'未安装'}</small></div>${button(s.installed?'打开 Steam':'在线安装',s.installed?'steam':'install','primary')}${button('离线导入','import')}</div><div class="component"><div><strong>GNU Proton 与宿主桥</strong><small>由配套组件管理；每游戏兼容工具选择仍在 Steam 保存</small></div>${button('检查更新','check-update')}</div></div>${s.update?`<p class="mainstatus">更新先准备到独立区域，运行中的会话退出后再应用。</p>${button('准备更新','update','primary')}`:''}<p class="note">高级：实际产品保留历史离线包识别、来源校验与只重置组件的边界。本原型不操作磁盘。</p>`}
function steamContent(){if(s.page==='downloads')return `<h1>下载</h1><p>官方 Steam 下载页示意。游戏下载与组件安装分开。</p><div class="downloadrow"><div><strong>新仙剑奇侠传</strong><small>已安装 · 无下载任务（示例）</small></div>${button('开始游戏','game-0','primary')}</div>`;if(s.page==='store')return `<div class="eyebrow">OFFICIAL STEAM · 页面结构示意</div><h1>发现下一段旅程</h1><p>商店、价格、支付与退款由当前官方 Steam 客户端负责。宿主不接管账号或结账，也不代替用户付款。</p><div class="downloadrow"><div><strong>示例游戏</strong><small>仅演示购物车、外部验证与返回流程，无真实价格或订单</small></div>${button('查看购买流程','checkout','primary')}</div>`;return `<h1>${s.steamMode==='bigPicture'?'最近游戏':'游戏库'}</h1>${s.cloud==='pending'?'<p class="mainstatus">游戏已结束 · 云同步状态待 Steam 确认</p>':s.cloud==='synced'?'<p class="mainstatus">云同步完成（模拟官方结果）</p>':''}${covers(games.slice(0,2))}<p class="note">官方 Steam 页面示意，不是在 ArkUI 重新实现的商店或账号系统。</p>`}
function steam(){const content=`<section class="runtime"><nav class="steamnav" aria-label="Steam 页面"><span class="steambrand">STEAM</span>${button('游戏库','steam-library',s.page==='library'?'active':'')}${button('商店','steam-store',s.page==='store'?'active':'')}${button('下载','steam-downloads',s.page==='downloads'?'active':'')}<div class="spacer"></div>${button('☰ 系统菜单','menu')}</nav><main class="steamcontent">${steamContent()}</main><footer class="runtimefoot"><span><span class="kbd">A</span>选择</span><span><span class="kbd">B</span>Steam 内返回</span><span>同一 Linux Steam 会话 · ${s.steamMode==='bigPicture'?'官方大屏':'普通窗口'}</span></footer></section>`;return s.steamMode==='bigPicture'?content:`<div class="desktopstage"><div class="steamwindow"><div class="steamtitles">Steam<div class="spacer"></div>${button('—','hide-steam','ghost')}${button('⛶ 大屏','mode','ghost')}${button('关闭','exit-steam','ghost')}</div>${content}</div></div>`}
function launch(){const name=s.intent==='game'&&s.pendingGame?s.pendingGame.name:'Linux Steam';return `<section class="launch"><div class="launchlogo">HMOSDECK</div><h1>${esc(name)}</h1><div class="loading" aria-hidden="true"></div><div class="launchstatus" role="status" aria-live="polite">${esc(s.phase)}</div><p>实际产品在当前代次内容帧可呈现后交接。此处进度为模拟。</p><div class="actions">${button('返回首页，后台继续','background')}${button('取消本次启动','cancel-start','ghost')}</div></section>`}
function recovery(){return `<section class="launch"><div class="launchlogo">HMOSDECK</div><h1>启动较慢</h1><p>当前阶段长时间没有进展。后台会话状态仍可查看，不重复创建客户端，不因黑场自动结束游戏。</p><div class="details">等待阶段：${esc(s.phase||'等待 Steam 内容')}<br>本页模拟无进展保护，不代表发生了真实故障。</div><div class="actions" style="margin-top:24px">${button('继续等待','continue-start','primary')}${button('返回首页','background')}${button('取消本次启动','cancel-start','ghost')}</div></section>`}
function login(){return `<section class="launch"><div class="loginbox"><h1>登录 Steam</h1><p>官方登录页占位。此原型不接受真实账号或密码。</p><label>示意账号<input value="请勿填写真实账号" disabled></label><label>示意密码<input value="仅交互演示，无实际输入" disabled></label><div class="actions">${button('模拟登录成功','login','primary')}${button('返回首页','background')}</div></div></section>`}
function game(){const g=s.game||games[0];return `<section class="game ${s.gameMode==='nativeWindow'?'windowgame':''}">${button('☰ 系统菜单','menu','menubutton')}<div class="gameframe"><div><div class="eyebrow">游戏画面示意</div><h1>${esc(g.name)}</h1><p>${s.gameMode==='fitFullscreen'?'保持比例铺满 · 不强改游戏分辨率':'原生窗口 · 每游戏可覆盖'}</p>${button('游戏内「离开游戏」','normal-exit')}</div><span class="demo">${esc(g.tag)} · 不修改图形、音频或存档</span></div></section>`}
function render(){root.innerHTML=s.view==='steam'?steam():s.view==='launch'?launch():s.view==='recovery'?recovery():s.view==='login'?login():s.view==='game'?game():shell()}
function openSettings(){dialog(`<h2>设置</h2><div class="preference"><span>应用主题<small>首次经典；切换后保存，不影响 Steam 模式</small></span>${button(s.theme==='classic'?'切换 Deck':'返回经典','settings-theme')}</div><label class="preference"><span>Steam 默认显示<small>首次大屏；用户选择普通窗口后沿用</small></span><select id="mode-pref"><option value="bigPicture" ${s.steamMode==='bigPicture'?'selected':''}>Steam 大屏</option><option value="desktop" ${s.steamMode==='desktop'?'selected':''}>普通窗口</option></select></label><label class="preference"><span>游戏呈现<small>保持比例；不强制游戏启动参数</small></span><select id="game-pref"><option value="fitFullscreen" ${s.gameMode==='fitFullscreen'?'selected':''}>默认全屏</option><option value="nativeWindow" ${s.gameMode==='nativeWindow'?'selected':''}>原生窗口</option></select></label><div class="menulist" style="margin-top:18px">${button('Steam 组件与更新','components')}</div><div class="actions">${button('完成','close','primary')}</div>`)}
function showMenu(){const gameFront=s.view==='game';dialog(`<h2>${gameFront?'游戏菜单':'Steam 菜单'}</h2><p>${gameFront?esc(s.game.name)+' · '+esc(s.game.tag):'当前 Linux Steam 会话'}</p><div class="menulist">${button('继续'+(gameFront?'游戏':'Steam'),'close')}${button('返回应用首页','menu-home')}${gameFront?button('显示 Steam','show-steam'):button(s.steamMode==='bigPicture'?'切为普通窗口':'进入 Steam 大屏','mode')}${s.running&&!gameFront?button('继续游戏','resume'):''}${button('显示与输入设置','settings')}${gameFront?button('退出游戏','exit-game'):button('退出 Steam','exit-steam')}</div><p class="menufoot">返回首页保留会话；B / Esc 关闭本菜单。游戏是否暂停取决于游戏本身。</p>`)}
function clearPhases(){clearTimeout(phaseTimer);phaseTimer=0}
function beginSteam(pendingGame=null){if(!s.installed){s.page='components';s.view='home';render();installDialog();return}if(phaseTimer||s.view==='launch'||s.view==='recovery'){s.view='launch';s.foreground='launch';render();toast('恢复同一次启动，不创建第二个会话');return}s.pendingGame=pendingGame;if(s.steam){if(!s.logged){s.view='login';render()}else if(pendingGame)beginGame(pendingGame);else{s.view='steam';s.foreground='steam';render()}return}s.generation++;s.intent=pendingGame?'game':'steam';s.phase='校验运行组件';s.view='launch';s.foreground='launch';render();queueSteam()}
function queueSteam(){const gen=s.generation;let step=0;const phases=['准备 Linux 会话','打开官方 Linux ARM64 Steam','等待当前窗口内容呈现'];function next(){if(gen!==s.generation)return;s.phase=phases[Math.min(step,phases.length-1)];if(s.view==='launch')render();step++;if(step<=phases.length){phaseTimer=setTimeout(next,650);return}s.steam=true;phaseTimer=0;if(!s.logged){if(s.foreground==='launch'){s.view='login';render()}else toast('Steam 登录页已就绪，可从首页恢复');return}if(s.pendingGame){const g=s.pendingGame;s.pendingGame=null;beginGame(g,s.foreground==='launch');return}if(s.foreground==='launch'){s.view='steam';s.foreground='steam';s.page='library';render()}else{render();toast('Steam 已就绪；保持当前首页，不自动跳转')}}phaseTimer=setTimeout(next,450)}
function beginGame(g,foreground=true){if(s.running){s.view='game';s.foreground='game';render();return}s.pendingGame=g;s.intent='game';s.phase='Steam 正在处理许可、同步与启动';if(foreground){s.view='launch';s.foreground='launch'}render();const gen=s.generation;phaseTimer=setTimeout(()=>{if(gen!==s.generation)return;phaseTimer=0;if(g===games[1]){s.phase='等待游戏启动器';if(s.foreground==='launch'){dialog(`<h2>游戏启动器</h2><p>仙剑四 · 配置／启动窗口保持正常尺寸。确认后才把真正游戏画面全屏呈现。</p><div class="actions">${button('模拟点击「开始游戏」','launcher-go','primary')}${button('取消','cancel-start')}</div>`)}else toast('启动器需要操作，请恢复 Steam')}else finishGameLaunch()},1100)}
function finishGameLaunch(){s.game=s.pendingGame||games[0];s.pendingGame=null;s.running=true;s.cloud='unknown';if(s.foreground==='launch'){s.view='game';s.foreground='game'}render()}
function requestGame(index){const g=games[index];if(s.running){toast('已有游戏在运行，恢复当前游戏');s.view='game';s.foreground='game';render();return}if(index===3){dialog(`<h2>图形测试</h2><p>内建工具保持原生窗口，便于切换 D3D9 / D3D11 与设置。全屏规则不强制套用工具窗口。</p><div class="actions">${button('返回','close','primary')}</div>`);return}if(index===2){s.pendingGame=g;s.intent='game';s.phase='通过现有 OHOS Wine 路径启动';s.view='launch';s.foreground='launch';render();phaseTimer=setTimeout(finishGameLaunch,900);return}if(!s.steam||!s.logged)beginSteam(g);else beginGame(g)}
function normalExit(){closeDialog();s.running=false;s.pendingGame=null;s.cloud='pending';s.view=s.steam?'steam':'home';s.page='library';s.foreground=s.view;render();toast('游戏已结束；云同步等待官方客户端确认')}
function exitGame(){dialog(`<h2>退出游戏？</h2><p>优先请求当前游戏正常关闭。请先保存；返回首页可让游戏继续运行。</p><div class="actions">${button('请求正常退出','normal-exit','primary')}${button('继续游戏','close')}${button('模拟游戏无响应','stuck','ghost')}</div>`)}
function exitSteam(){if(s.running){dialog(`<h2>游戏仍在运行</h2><p>先退出游戏，再关闭 Steam，保留正常存档与同步机会。</p><div class="actions">${button('返回游戏','resume','primary')}${button('请求退出游戏','exit-game')}${button('取消','close')}</div>`);return}dialog(`<h2>退出 Steam？</h2><p>${s.cloud==='pending'?'云同步状态尚未确认。实际产品应优先打开 Steam 查看结果；无法确认时明确提示风险。':'会正常结束当前 Linux Steam 会话，返回应用首页。'}</p><div class="actions">${s.cloud==='pending'?button('模拟 Steam 确认同步完成','sync-result','primary'):button('正常退出 Steam','confirm-exit-steam','primary')}${s.cloud==='pending'?button('仍然退出','confirm-exit-steam'):''}${button('取消','close')}</div>`)}
function installDialog(updating=false){installUpdating=updating;dialog(`<h2>${updating?'准备组件更新':'安装 Linux Steam'}</h2><p>${updating?'更新下载到独立暂存区，运行中的会话保持原版本。':'可在线安装或从本地包导入。导入来源通过系统选择器选择，不要求公开下载路径。'}</p><div class="details">下载大小和所需空间：来自发布清单<br>游戏库、账号与存档保留<br>安装完成停留组件页，不自动启动</div><div class="actions">${button(updating?'下载更新':'在线安装','start-install','primary')}${button('选择离线包','import')}${button('取消','close')}</div>`)}
function installTick(){if(installPaused)return;installProgress=Math.min(100,installProgress+20);dialog(`<h2>${installUpdating?'准备更新':'安装组件'}</h2><p>${installProgress<80?'模拟下载／导入和校验':installProgress<100?'模拟安装与检查':'准备完成'} · ${installProgress}%</p><progress value="${installProgress}" max="100" aria-label="模拟组件进度"></progress><div class="actions">${button('暂停','pause-install')}${button('模拟错误','install-error','ghost')}</div>`);if(installProgress===100){clearInterval(installTimer);installTimer=0;s.installed=true;s.update=false;closeDialog();s.view='home';s.page='components';s.foreground='home';render();toast(installUpdating?'更新已准备；本原型不替换运行中的组件':'组件已就绪，点击「打开 Steam」才会启动')} }
function startInstall(){clearInterval(installTimer);installPaused=false;installProgress=0;installTimer=setInterval(installTick,450);installTick()}
function handle(action){if(action.startsWith('game-')){requestGame(Number(action.slice(5)));return}if(action.startsWith('tab-')){s.tab=action.slice(4);s.page='library';render();return}if(action.startsWith('steam-')){s.page=action.slice(6);render();return}switch(action){case'home':s.view='home';s.page='home';s.foreground='home';render();break;case'library':s.view='home';s.page='library';s.foreground='home';render();break;case'theme':s.theme=s.theme==='classic'?'deck':'classic';storage.set('theme',s.theme);render();break;case'settings-theme':handle('theme');openSettings();break;case'settings':openSettings();break;case'components':closeDialog();s.view='home';s.page='components';s.foreground='home';render();break;case'steam':s.page='library';beginSteam();break;case'background':closeDialog();s.foreground='home';s.view='home';s.page='home';render();break;case'cancel-start':clearPhases();s.generation++;s.pendingGame=null;s.intent='';closeDialog();s.view='home';s.foreground='home';s.page='home';render();toast('取消本次模拟启动；已有会话不被清除');break;case'continue-start':s.view='launch';s.foreground='launch';render();if(s.steam&&s.pendingGame)beginGame(s.pendingGame);else queueSteam();break;case'simulate-slow':clearPhases();s.generation++;s.phase='等待当前窗口的首帧呈现';s.intent='steam';s.view='recovery';s.foreground='launch';render();break;case'login':s.logged=true;if(s.pendingGame)beginGame(s.pendingGame);else{s.view='steam';s.foreground='steam';render()}break;case'launcher-go':closeDialog();finishGameLaunch();break;case'menu':showMenu();break;case'menu-home':closeDialog();s.view='home';s.page='home';s.foreground='home';render();break;case'mode':closeDialog();saveMode(s.steamMode==='bigPicture'?'desktop':'bigPicture');s.view='steam';s.foreground='steam';render();toast('沿用同一会话；显式模式选择已保存');break;case'hide-steam':s.view='home';s.page='home';s.foreground='home';render();break;case'show-steam':closeDialog();s.page='library';s.view=s.steam?'steam':'home';s.foreground=s.view;render();break;case'resume':closeDialog();if(s.running){s.view='game';s.foreground='game';render()}break;case'normal-exit':normalExit();break;case'exit-game':exitGame();break;case'stuck':dialog(`<h2>游戏尚未响应关闭</h2><p>模拟等待正常关闭超时。只对当前游戏提供强制结束，其他进程保持。</p><div class="actions">${button('继续等待','exit-game','primary')}${button('强制结束…','force-confirm','danger')}${button('返回游戏','resume')}</div>`);break;case'force-confirm':dialog(`<h2>强制结束当前游戏？</h2><p>未保存进度可能丢失。强制结束不代表云同步成功。</p><div class="actions">${button('强制结束','force-game','danger')}${button('取消','close')}</div>`);break;case'force-game':normalExit();toast('已模拟强制结束；同步保持待确认');break;case'exit-steam':exitSteam();break;case'confirm-exit-steam':closeDialog();s.steam=false;s.view='home';s.foreground='home';s.page='home';render();toast('Steam 会话已模拟退出');break;case'sync-result':s.cloud='synced';closeDialog();render();toast('模拟收到官方同步完成结果');break;case'checkout':dialog(`<h2>Steam 官方结账</h2><p>这里仅示意原客户端的购物车。没有实际商品、价格、订单或付款按钮。</p><div class="details">Steam 负责账号、价格与支付结果。宿主只保持窗口归属、输入和返回路径。</div><div class="actions">${button('模拟需要外部验证','external-checkout','primary')}${button('取消购买，回到商店','close')}</div>`);break;case'external-checkout':dialog(`<h2>外部验证示意</h2><p>真实产品在收到合法导航请求后打开浏览器或支付应用。返回时恢复同一结账窗口，不因返回就显示购买成功。</p><div class="actions">${button('模拟返回 Steam','return-checkout','primary')}${button('取消','close')}</div>`);break;case'return-checkout':dialog(`<h2>已返回原结账页面</h2><p>支付结果待官方 Steam 确认。用户可以继续或取消；没有自动付款。</p><div class="actions">${button('回到商店','close','primary')}</div>`);break;case'install':installDialog();break;case'check-update':s.update=true;s.page='components';render();toast('模拟发现配套更新，已在组件页集中显示');break;case'update':installDialog(true);break;case'import':dialog(`<h2>导入离线组件包</h2><p>实际产品用系统文件选择器选择 C 盘／下载等用户授权位置。此处不打开真实文件。</p><div class="actions">${button('模拟选择有效包','start-install','primary')}${button('取消','close')}</div>`);break;case'start-install':startInstall();break;case'pause-install':case'install-error':installPaused=true;dialog(`<h2>${action==='install-error'?'校验／网络错误（模拟）':'已暂停'}</h2><p>已完成内容保留，继续后复用现有进度；游戏库未修改。</p><div class="actions">${button('继续','continue-install','primary')}${button('关闭面板','close')}</div>`);break;case'continue-install':installPaused=false;installTick();break;case'membership':dialog(`<h2>会员与赞助</h2><p>支持设备从侧栏进入现有合规页面，与 Steam 游戏购买分开。手机类型隐藏此入口。</p><div class="actions">${button('返回','close','primary')}</div>`);break;case'close':closeDialog();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='mode-pref'){saveMode(e.target.value);render()}if(e.target.id==='game-pref'){s.gameMode=e.target.value;storage.set('game-mode',s.gameMode);render()}});
document.querySelector('#scenario').addEventListener('change',e=>{clearPhases();clearInterval(installTimer);installTimer=0;closeDialog();s.generation++;s.installed=e.target.value!=='missing';s.logged=['ready','update'].includes(e.target.value);s.update=e.target.value==='update';s.steam=false;s.running=false;s.pendingGame=null;s.cloud='unknown';s.view='home';s.page='home';s.foreground='home';render()});
document.querySelector('#device').addEventListener('change',e=>{s.device=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open&&(s.view==='game'||s.view==='steam')){e.preventDefault();showMenu()}});
s.page='home';render();
</script>
</body>
</html>
